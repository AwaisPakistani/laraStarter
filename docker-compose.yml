services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lara_starter_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - mysql
      - redis

  nginx:
        image: nginx:alpine
        container_name: lara_starter_nginx
        restart: unless-stopped
        ports:
        - "8080:80"
        volumes:
         - .:/var/www 
         - ./nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
        - app
  mysql:
    image: mysql:8.4
    container_name: lara_starter_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lara_starter
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: password
      MYSQL_USER: laravel
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: lara_starter_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
  redis:
    image: redis:alpine
    container_name: lara_starter_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lara_starter_horizon
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan horizon
    volumes:
      - .:/var/www
    depends_on:
      - app
      - redis
      - mysql

volumes:
  mysql_data: